[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quantum-bridge-lab"
version = "0.1.0"
description = "Offline engineering preflight for a preregistered qubit-control comparison"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=2.3,<3", "scipy>=1.16,<2", "cma>=4.4,<5"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
 "ruff>=0.12,<1",
 "pip-audit>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
